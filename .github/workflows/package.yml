name: Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - shell: powershell
        run: ./scripts/build_windows.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-windows-x64
          path: release/*
  installed-acceptance:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke_windows.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: GameTranslator-windows-x64
          path: ${{ runner.temp }}/package-artifact
      - name: Verify and extract delivered ZIP
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/package-artifact" -Filter '*.zip' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one release ZIP.' }
          $package = $packages[0]
          $expected = ((Get-Content -LiteralPath "$($package.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Delivered ZIP checksum mismatch.' }
          Expand-Archive -LiteralPath $package.FullName -DestinationPath "$env:RUNNER_TEMP/acceptance-package"
      - name: Install and test without Python or API settings in app environment
        run: python scripts/smoke_windows.py "${{ runner.temp }}/acceptance-package/GameTranslator" --install --isolated-environment
