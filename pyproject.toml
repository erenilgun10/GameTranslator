[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-translator"
version = "0.4.0b1"
description = "Safe, reversible RPG Maker MV/MZ file translation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Eren İlgün"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
game-translator = "game_translator.cli:main"

[project.gui-scripts]
game-translator-desktop = "game_translator.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
